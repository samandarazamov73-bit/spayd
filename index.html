<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROOM 1107</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      color: #d8d8d8;
      cursor: default;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* Diegetic crosshair: just a small dot, becomes a ring when interactable */
    #crosshair {
      position: fixed;
      left: 50%; top: 50%;
      width: 6px; height: 6px;
      margin-left: -3px; margin-top: -3px;
      border-radius: 50%;
      background: rgba(230, 230, 230, 0.55);
      box-shadow: 0 0 4px rgba(0,0,0,0.6);
      pointer-events: none;
      transition: transform 120ms ease, background 120ms ease, border 120ms ease;
      z-index: 10;
    }
    #crosshair.hover {
      width: 14px; height: 14px;
      margin-left: -7px; margin-top: -7px;
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
    }

    /* Start screen */
    #start-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0a0a0a 0%, #000 80%);
      z-index: 100;
      transition: opacity 1.2s ease;
      letter-spacing: 0.2em;
    }
    #start-screen h1 {
      font-weight: 200; font-size: 28px; margin: 0 0 8px;
      color: #c8c8c8;
    }
    #start-screen .sub {
      font-size: 11px; color: #6a6a6a; margin-bottom: 40px;
    }
    #start-screen .keys {
      font-size: 11px; color: #5a5a5a; margin-top: 30px;
      line-height: 1.8;
      text-align: center;
    }
    #start-button {
      background: transparent;
      border: 1px solid #444;
      color: #c8c8c8;
      padding: 14px 36px;
      font-size: 12px;
      letter-spacing: 0.3em;
      cursor: pointer;
      transition: all 200ms ease;
    }
    #start-button:hover {
      border-color: #aaa;
      color: #fff;
      background: rgba(255,255,255,0.04);
    }

    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000; z-index: 200;
      color: #555; font-size: 11px; letter-spacing: 0.4em;
    }
  /* Отладочный HUD */
  #debug {
    position: fixed;
    top: 10px; left: 10px;
    z-index: 30;
    color: #6f6;
    font: 11px/1.5 monospace;
    background: rgba(0,0,0,0.5);
    padding: 6px 10px;
    border-radius: 4px;
    pointer-events: none;
    white-space: pre;
  }

  /* WASD клавиши-подсказки */
  #keys-hud {
    position: fixed;
    right: 20px; top: 20px;
    display: grid;
    grid-template-columns: 36px 36px 36px;
    grid-template-rows: 36px 36px;
    gap: 4px;
    z-index: 25;
    pointer-events: none;
    user-select: none;
  }
  #keys-hud .k {
    background: rgba(20,20,20,0.7);
    border: 1.5px solid rgba(255,255,255,0.25);
    border-radius: 5px;
    color: rgba(255,255,255,0.7);
    font: bold 14px monospace;
    display: flex; align-items: center; justify-content: center;
    transition: all 80ms ease;
  }
  #keys-hud .k.active {
    background: rgba(255,180,80,0.9);
    border-color: #fff;
    color: #000;
    transform: scale(1.05);
  }
  #keys-hud .k.placeholder { background: transparent; border: none; }
  #keys-w { grid-column: 2; grid-row: 1; }
  #keys-a { grid-column: 1; grid-row: 2; }
  #keys-s { grid-column: 2; grid-row: 2; }
  #keys-d { grid-column: 3; grid-row: 2; }

  /* Индикатор движения */
  #move-status {
    position: fixed;
    top: 70px; right: 20px;
    z-index: 25;
    pointer-events: none;
    font: bold 12px monospace;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.2em;
    text-align: right;
  }
  #move-status.walking { color: #6f6; }

  /* Большие кнопки движения — для тех кому неудобно WASD */
  #move-pad {
    position: fixed;
    left: 30px; bottom: 30px;
    display: grid;
    grid-template-columns: 64px 64px 64px;
    grid-template-rows: 64px 64px;
    gap: 6px;
    z-index: 25;
    user-select: none;
    -webkit-user-select: none;
  }
  #move-pad .btn {
    background: rgba(20,20,20,0.7);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 12px;
    color: rgba(255,255,255,0.85);
    font: bold 28px sans-serif;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    touch-action: none;
    transition: all 80ms;
  }
  #move-pad .btn:active, #move-pad .btn.active {
    background: rgba(255,180,80,0.9);
    border-color: #fff;
    color: #000;
    transform: scale(0.95);
  }
  #move-pad .ph { background: transparent; border: none; pointer-events: none; }
  #pad-up    { grid-column: 2; grid-row: 1; }
  #pad-left  { grid-column: 1; grid-row: 2; }
  #pad-down  { grid-column: 2; grid-row: 2; }
  #pad-right { grid-column: 3; grid-row: 2; }

  /* Большая кнопка взаимодействия */
  #interact-btn {
    position: fixed;
    right: 30px; bottom: 50px;
    width: 90px; height: 90px;
    background: rgba(20,20,20,0.7);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 50%;
    color: rgba(255,255,255,0.85);
    font: bold 12px sans-serif;
    letter-spacing: 0.15em;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    z-index: 25;
    transition: all 100ms;
  }
  #interact-btn.hover {
    background: rgba(255,180,80,0.9);
    border-color: #fff;
    color: #000;
  }
    position: fixed;
    left: 30px; bottom: 30px;
    width: 130px; height: 130px;
    border: 2px solid rgba(255,255,255,0.25);
    border-radius: 50%;
    background: rgba(0,0,0,0.25);
    z-index: 20;
    display: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #joystick.active { display: block; }
  #joystick-thumb {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.40);
    border: 2px solid rgba(255,255,255,0.6);
    pointer-events: none;
  }

  /* Кнопка взаимодействия для тача */
  #touch-action {
    position: fixed;
    right: 30px; bottom: 30px;
    width: 100px; height: 100px;
    border: 2px solid rgba(255,255,255,0.30);
    border-radius: 50%;
    background: rgba(0,0,0,0.30);
    color: rgba(255,255,255,0.7);
    font-size: 11px;
    letter-spacing: 0.2em;
    z-index: 20;
    display: none;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    align-items: center;
    justify-content: center;
  }
  #touch-action.active { display: flex; }
  #touch-action.hover { background: rgba(255,200,80,0.4); border-color: rgba(255,220,140,0.9); color: #fff; }

  .hidden { opacity: 0; pointer-events: none; }
    .gone { display: none !important; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <div id="loading">ЗАГРУЗКА</div>

  <div id="start-screen" class="gone">
    <h1>R O O M&nbsp;&nbsp;1 1 0 7</h1>
    <div class="sub">a slow-burn experience</div>
    <button id="start-button">ВОЙТИ</button>
    <div class="keys">
      WASD &mdash; движение &nbsp;&nbsp;|&nbsp;&nbsp; SHIFT &mdash; быстро<br/>
      ЛКМ &mdash; взаимодействовать<br/>
      МЫШЬ &mdash; обзор (или зажми ЛКМ и тяни, если курсор виден)<br/><br/>
      <em style="color:#3a3a3a;">наушники рекомендуются</em>
    </div>
  </div>

  <div id="app"></div>
  <div id="crosshair"></div>
  <div id="debug"></div>

  <div id="keys-hud">
    <div class="k placeholder"></div>
    <div id="keys-w" class="k">W</div>
    <div class="k placeholder"></div>
    <div id="keys-a" class="k">A</div>
    <div id="keys-s" class="k">S</div>
    <div id="keys-d" class="k">D</div>
  </div>
  <div id="move-status">СТОИТ</div>

  <!-- Большие кнопки движения для игры мышкой/тапом -->
  <div id="move-pad">
    <div class="ph"></div>
    <div id="pad-up"    class="btn">↑</div>
    <div class="ph"></div>
    <div id="pad-left"  class="btn">←</div>
    <div id="pad-down"  class="btn">↓</div>
    <div id="pad-right" class="btn">→</div>
  </div>

  <div id="interact-btn">ВЗЯТЬ</div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
