<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROOM 1107</title>
  <style>
    :root { color-scheme: dark; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Inter", "Helvetica Neue", Arial, sans-serif;
      color: #d8d8d8;
      cursor: default;
    }
    #app { position: fixed; inset: 0; }
    canvas { display: block; }

    /* Diegetic crosshair: just a small dot, becomes a ring when interactable */
    #crosshair {
      position: fixed;
      left: 50%; top: 50%;
      width: 6px; height: 6px;
      margin-left: -3px; margin-top: -3px;
      border-radius: 50%;
      background: rgba(230, 230, 230, 0.55);
      box-shadow: 0 0 4px rgba(0,0,0,0.6);
      pointer-events: none;
      transition: transform 120ms ease, background 120ms ease, border 120ms ease;
      z-index: 10;
    }
    #crosshair.hover {
      width: 14px; height: 14px;
      margin-left: -7px; margin-top: -7px;
      background: transparent;
      border: 1.5px solid rgba(255, 255, 255, 0.85);
    }

    /* Start screen */
    #start-screen {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #0a0a0a 0%, #000 80%);
      z-index: 100;
      transition: opacity 1.2s ease;
      letter-spacing: 0.2em;
    }
    #start-screen h1 {
      font-weight: 200; font-size: 28px; margin: 0 0 8px;
      color: #c8c8c8;
    }
    #start-screen .sub {
      font-size: 11px; color: #6a6a6a; margin-bottom: 40px;
    }
    #start-screen .keys {
      font-size: 11px; color: #5a5a5a; margin-top: 30px;
      line-height: 1.8;
      text-align: center;
    }
    #start-button {
      background: transparent;
      border: 1px solid #444;
      color: #c8c8c8;
      padding: 14px 36px;
      font-size: 12px;
      letter-spacing: 0.3em;
      cursor: pointer;
      transition: all 200ms ease;
    }
    #start-button:hover {
      border-color: #aaa;
      color: #fff;
      background: rgba(255,255,255,0.04);
    }

    #loading {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: #000; z-index: 200;
      color: #555; font-size: 11px; letter-spacing: 0.4em;
    }
    .hidden { opacity: 0; pointer-events: none; }
    .gone { display: none !important; }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
    }
  }
  </script>
</head>
<body>
  <div id="loading">ЗАГРУЗКА</div>

  <div id="start-screen" class="gone">
    <h1>R O O M&nbsp;&nbsp;1 1 0 7</h1>
    <div class="sub">a slow-burn experience</div>
    <button id="start-button">ВОЙТИ</button>
    <div class="keys">
      WASD &mdash; движение &nbsp;&nbsp;|&nbsp;&nbsp; МЫШЬ &mdash; обзор<br/>
      ЛКМ &mdash; взаимодействовать &nbsp;&nbsp;|&nbsp;&nbsp; SHIFT &mdash; ускоренный шаг<br/>
      ESC &mdash; освободить курсор<br/><br/>
      <em style="color:#3a3a3a;">наушники рекомендуются</em>
    </div>
  </div>

  <div id="app"></div>
  <div id="crosshair"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
